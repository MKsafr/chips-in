<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0a1a13">
<title>Chips-in - Virtual Casino Chips</title>
<style>
:root{
  --bg:#0a1a13;--card:#10291f;--line:#1f4f39;--tx:#eef6f0;--mut:#8fb3a1;--gold:#e8c35a;--red:#e5484d;--grn:#3ecf8e;--blu:#4c8dff;--inp:#07140f;--btn:#1d5a40;--btn2:#2a3d34;
}
[data-theme="dark"]{--bg:#121212;--card:#1e1e1e;--line:#333;--tx:#f0f0f0;--mut:#aaa;--gold:#ffd700;--red:#ff4d4d;--grn:#2ecc71;--blu:#3498db;--inp:#0d0d0d;--btn:#3a3a3a;--btn2:#2c2c2c}
[data-theme="blue"]{--bg:#0a121d;--card:#101c2e;--line:#1a2e4a;--tx:#edf2f7;--mut:#8fa3bf;--gold:#f6ad55;--red:#fc8181;--grn:#68d391;--blu:#63b3ed;--inp:#07101b;--btn:#1f4f86;--btn2:#1f3350}
[data-theme="crimson"]{--bg:#1a0a0a;--card:#291010;--line:#4f1f1f;--tx:#f6eeee;--mut:#b38f8f;--gold:#e8c35a;--red:#ff4d4d;--grn:#3ecf8e;--blu:#4c8dff;--inp:#140707;--btn:#7a2424;--btn2:#4a2a2a}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:radial-gradient(circle at 50% -10%,var(--line),var(--bg) 70%);color:var(--tx);font:15px/1.4 system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;min-height:100vh;padding-bottom:40px}
#app{max-width:680px;margin:0 auto;padding:12px}

.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.logo-box{display:flex;align-items:center;gap:8px}
.logo{font-weight:800;letter-spacing:.5px;font-size:18px}.logo b{color:var(--gold)}

.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.mut{color:var(--mut);font-size:13px}
h3{margin:0 0 8px;font-size:13px;color:var(--mut);text-transform:uppercase;letter-spacing:.8px}
.big{font-size:32px;font-weight:800;color:var(--gold)}

.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{justify-content:space-between}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:480px){.grid-2{grid-template-columns:1fr}}

button{font:inherit;font-weight:700;border:0;border-radius:10px;padding:11px 14px;background:var(--btn);color:var(--tx);cursor:pointer;transition:transform .1s}
button:active{transform:scale(.96)}
button.g{background:var(--btn2)}button.r{background:var(--red)}button.y{background:var(--gold);color:#222}button.b{background:var(--blu)}button.ok{background:var(--grn);color:#062}
button.s{padding:6px 10px;font-size:12px}button.f{flex:1}

input,select{font:inherit;background:var(--inp);border:1px solid var(--line);color:var(--tx);border-radius:10px;padding:10px;width:100%;min-width:0}
.pl{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border-radius:10px;border:1px solid transparent;margin-bottom:4px;background:rgba(0,0,0,.2)}
.pl.turn{border-color:var(--gold);box-shadow:0 0 0 2px #e8c35a33}.pl.out{opacity:.45}.pl.me{background:rgba(232,195,90,.1)}

.tag{font-size:10px;font-weight:800;padding:2px 5px;border-radius:5px;background:var(--btn2);margin-left:4px}
.tag.d{background:var(--gold);color:#222}.tag.a{background:var(--red)}.tag.t{background:var(--grn);color:#052}

.chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.chip{width:48px;height:48px;border-radius:50%;border:4px dashed rgba(255,255,255,.5);font-weight:800;font-size:12px;padding:0;color:#fff;display:grid;place-items:center;box-shadow:0 3px 6px rgba(0,0,0,.4)}
.c5{background:#c0392b}.c10{background:#2471c9}.c25{background:#1e9a5a}.c100{background:#222}.c500{background:#7d3cc4}.callin{background:linear-gradient(135deg,#e8c35a,#e5484d);color:#000;border-style:solid}

.pot{text-align:center}.pot .big{font-size:38px}
.log{max-height:160px;overflow-y:auto;font-size:12px;color:var(--mut)}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--red);color:#fff;padding:10px 16px;border-radius:12px;font-weight:700;z-index:99;max-width:90%;box-shadow:0 4px 12px rgba(0,0,0,.5)}

.overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:999;text-align:center;padding:20px}
.overlay h1{font-size:36px;color:var(--red);margin:0 0 10px}

.winner-modal{position:fixed;inset:0;background:rgba(0,0,0,.9);display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:9999;text-align:center}
.confetti-box{font-size:50px;animation:bounce 0.8s infinite alternate}
@keyframes bounce{from{transform:scale(0.8)}to{transform:scale(1.2)}}
</style>
</head>
<body>
<div id="app"></div>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>Number(n||0).toLocaleString('id-ID');

let token = localStorage.cb_token || (localStorage.cb_token = Math.random().toString(36).slice(2) + Date.now().toString(36));
let roomCode = localStorage.cb_room || '';
const THEMES = { default: 'Hijau Kasino', dark: 'Dark Mode', blue: 'Ocean Blue', crimson: 'Crimson Red' };
// Tema disimpan di perangkat masing-masing (tidak dikirim ke server). Default: hijau.
let currentTheme = THEMES[localStorage.cb_theme] ? localStorage.cb_theme : 'default';
document.documentElement.setAttribute('data-theme', currentTheme);
syncThemeColor();

let st = null, draft = { w: {} }, toastMsg = '', hostOpen = false, deferredPrompt = null;
let audioCtx = null;

if('serviceWorker' in navigator){
  navigator.serviceWorker.register('/sw.js').catch(()=>{});
}
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  render();
});

function playSFX(type) {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    
    const now = audioCtx.currentTime;
    if (type === 'raise') {
      osc.frequency.setValueAtTime(300, now);
      osc.frequency.exponentialRampToValueAtTime(600, now + 0.15);
      gain.gain.setValueAtTime(0.3, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
      osc.start(now); osc.stop(now + 0.15);
    } else if (type === 'fold') {
      osc.frequency.setValueAtTime(200, now);
      osc.frequency.exponentialRampToValueAtTime(100, now + 0.2);
      gain.gain.setValueAtTime(0.3, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
      osc.start(now); osc.stop(now + 0.2);
    } else if (type === 'stage') {
      osc.frequency.setValueAtTime(523.25, now);
      osc.frequency.setValueAtTime(659.25, now + 0.1);
      gain.gain.setValueAtTime(0.2, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
      osc.start(now); osc.stop(now + 0.25);
    }
  } catch(e) {}
}

async function api(type, extra = {}) {
  try {
    const r = await fetch('/api', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token, roomCode, type, ...extra })
    });
    const j = await r.json();
    if (j.err) flash(j.err);
    if (j.roomCode) {
      roomCode = j.roomCode;
      localStorage.cb_room = roomCode;
      connect();
    }
    return j;
  } catch {
    flash('Koneksi ke server terputus');
  }
}

function flash(m) { toastMsg = m; render(); setTimeout(() => { toastMsg = ''; render(); }, 2500); }

let es = null;
function connect() {
  if (!roomCode) return;
  if (es) es.close();
  es = new EventSource(`/events?token=${token}&room=${roomCode}`);
  es.onerror = () => { if (!st) render(); };
  es.onmessage = e => {
    try {
      const data = JSON.parse(e.data);
      if (data.error === 'ROOM_NOT_FOUND') {
        roomCode = '';
        localStorage.cb_room = '';
        st = null;
        flash('Room telah ditutup atau tidak ada');
        render();
        return;
      }
      if (st && data.lastEvent && st.lastEvent !== data.lastEvent) {
        if (data.lastEvent.includes('Raise')) playSFX('raise');
        else if (data.lastEvent.includes('Fold')) playSFX('fold');
        else if (data.lastEvent.includes('FLOP') || data.lastEvent.includes('TURN') || data.lastEvent.includes('RIVER')) playSFX('stage');
      }
      st = data;
      render();
    } catch(err) {
      console.error(err);
    }
  };
}

const d = (k, def) => draft[k] !== undefined ? draft[k] : def;
const setD = (k, v) => { draft[k] = v; };
const num = id => Math.floor(+($('#' + id) || {}).value || 0);

function syncThemeColor() {
  const m = document.querySelector('meta[name=theme-color]');
  if (m) m.content = getComputedStyle(document.documentElement).getPropertyValue('--bg').trim() || '#0a1a13';
}
function changeTheme(th) {
  if (!THEMES[th]) th = 'default';
  currentTheme = th;
  localStorage.cb_theme = th;
  document.documentElement.setAttribute('data-theme', th);
  syncThemeColor();
}
function themeSelect() {
  return `<select onchange="changeTheme(this.value)" title="Tampilan (hanya di perangkat ini)" style="width:auto;padding:4px 8px;font-size:12px">` +
    Object.keys(THEMES).map(k => `<option value="${k}" ${currentTheme === k ? 'selected' : ''}>${THEMES[k]}</option>`).join('') + `</select>`;
}

function exitRoom() {
  if (es) { es.close(); es = null; }
  roomCode = ''; localStorage.cb_room = ''; st = null; hostOpen = false;
  render();
}
async function leaveSeat() {
  const wasHost = st && st.isHost;
  const j = await api('leave');
  if (j && j.ok && !wasHost) exitRoom();
}

function pRow(p, extra = '') {
  if (!p) return '';
  const k = st.poker || {}, pk = st.mode === 'poker';
  const t = [];
  if (pk && k.active && k.dealer === p.id) t.push('<span class="tag d">D</span>');
  if (pk && k.active && k.sbId === p.id) t.push('<span class="tag">SB</span>');
  if (pk && k.active && k.bbId === p.id) t.push('<span class="tag">BB</span>');
  if (p.folded) t.push('<span class="tag">FOLD</span>');
  if (p.allin) t.push('<span class="tag a">ALL-IN</span>');
  if (pk && k.turn === p.id) t.push('<span class="tag t">GILIRAN</span>');
  
  const bet = pk ? (p.bet ? `<div class="mut">bet ${fmt(p.bet)}</div>` : '') : (p.bjBet ? `<div class="mut">bet ${fmt(p.bjBet)}${p.bjSplitBet ? ' | split '+fmt(p.bjSplitBet) : ''}</div>` : '');
  const out = pk && k.active && (!p.inHand || p.folded);

  return `<div class="pl ${k.turn === p.id && pk ? 'turn' : ''} ${out ? 'out' : ''} ${p.id === st.you ? 'me' : ''}">
    <div><b>${esc(p.name)}</b>${t.join('')}${extra}</div>
    <div style="text-align:right"><b style="color:var(--gold)">${fmt(p.chips)}</b>${bet}</div></div>`;
}

function pokerView(me) {
  const k = st.poker || {};
  let h = `<div class="grid-2">`;
  
  h += `<div><div class="card pot"><div class="mut">${(k.stage || 'IDLE').toUpperCase()}${k.active && k.currentBet ? ' • Taruhan saat ini ' + fmt(k.currentBet) : ''}</div>
    <div class="big">${fmt(k.pot)}</div><div class="mut">Total Pot</div></div></div>`;

  h += `<div><div class="card"><h3>Feed Terbaru</h3><div class="mut" style="font-weight:bold;color:var(--gold)">${esc(st.lastEvent || '-')}</div></div></div></div>`;

  if (st.isHost && k.active && !st.dealerConfirmedStage && k.stage !== 'showdown') {
    h += `<div class="card" style="border-color:var(--gold)">
      <h3>Aksi Bandar (Dealer)</h3>
      <div class="mut" style="margin-bottom:8px">Buka kartu <b>${(k.stage || '').toUpperCase()}</b> di meja fisik, lalu tekan tombol di bawah ini agar pemain bisa bertaruh.</div>
      <button class="y" style="width:100%" onclick="api('confirmDealerStage')">Tampilkan Kartu ${(k.stage || '').toUpperCase()}</button>
    </div>`;
  }

  h += `<div class="card"><h3>Daftar Pemain</h3>${(st.players || []).map(p => pRow(p)).join('') || '<div class="mut">Belum ada pemain</div>'}</div>`;

  if (me && k.active && k.turn === me.id) {
    if (!st.dealerConfirmedStage) {
      h += `<div class="card" style="border-color:var(--gold)"><h3>Giliranmu</h3><div class="mut">Tunggu Bandar mengonfirmasi pembukaan kartu ${(k.stage || '').toUpperCase()} di meja fisik...</div></div>`;
    } else {
      const toCall = (k.currentBet || 0) - (me.bet || 0), callAmt = Math.min(toCall, me.chips), maxTo = me.bet + me.chips, minTo = Math.min((k.currentBet || 0) + (k.minRaise || 0), maxTo);
      const canRaise = maxTo > (k.currentBet || 0);
      h += `<div class="card" style="border-color:var(--gold)"><h3>Giliranmu</h3>
        <div class="row"><button class="r f" onclick="api('act',{a:'fold'})">Fold</button>
        <button class="ok f" onclick="api('act',{a:'call'})">${toCall > 0 ? 'Call ' + fmt(callAmt) : 'Check'}</button></div>`;
      if (canRaise) {
        h += `<div class="mut" style="margin:10px 0 4px">Raise ke (Min ${fmt(minTo)})</div>
        <div class="row"><input id="raise" type="number" inputmode="numeric" value="${d('raise', minTo)}" oninput="setD('raise',this.value)">
        <button class="y" onclick="api('act',{a:'raise',amount:num('raise')})">Raise</button></div>
        <div class="row" style="margin-top:6px">
        <button class="g s" onclick="qr(${minTo},0)">Min</button>
        <button class="g s" onclick="qr(0,.5)">½ Pot</button>
        <button class="g s" onclick="qr(0,1)">Pot</button>
        <button class="r s" onclick="api('act',{a:'allin'})">All-in ${fmt(me.chips)}</button></div>`;
      }
      h += '</div>';
    }
  }

  if (k.stage === 'showdown') h += showdown();
  return h;
}

function qr(minTo, frac) {
  const k = st.poker || {}, me = (st.players || []).find(p => p.id === st.you) || {}, maxTo = (me.bet || 0) + (me.chips || 0), toCall = (k.currentBet || 0) - (me.bet || 0);
  let v = frac ? (k.currentBet || 0) + Math.round(((k.pot || 0) + toCall) * frac) : minTo;
  v = Math.max(Math.min((k.currentBet || 0) + (k.minRaise || 0), maxTo), Math.min(v, maxTo));
  draft.raise = v; render();
}

function showdown() {
  const k = st.poker || {}, nm = id => { const p = (st.players || []).find(x => x.id === id); return p ? esc(p.name) : 'Pemain'; };
  let h = `<div class="card" style="border-color:var(--gold)"><h3>Showdown — Tentukan Pemenang</h3>`;
  (k.layers || []).forEach((l, i) => {
    h += `<div style="margin-top:8px"><b>${i === 0 ? 'Pot Utama' : 'Side Pot ' + i}</b> <span style="color:var(--gold)">(${fmt(l.amount)})</span>`;
    h += l.elig.map(id => st.isHost ? `<label style="display:flex;gap:8px;align-items:center;padding:4px 0"><input type="checkbox" ${draft.w[i + '_' + id] ? 'checked' : ''} onchange="draft.w['${i}_${id}']=this.checked"> ${nm(id)}</label>` : `<div class="mut">• ${nm(id)}</div>`).join('');
    h += '</div>';
  });
  h += st.isHost ? `<button class="ok" style="width:100%;margin-top:10px" onclick="doAward()">Kirim Pot</button>` : `<div class="mut" style="margin-top:8px">Menunggu Bandar memilih pemenang…</div>`;
  return h + '</div>';
}

function doAward() {
  const winners = (st.poker.layers || []).map((l, i) => l.elig.filter(id => draft.w[i + '_' + id]));
  api('award', { winners });
}

function bjView(me) {
  const bj = st.bj || {};
  let h = `<div class="grid-2">
    <div class="card pot"><div class="mut">Blackjack</div><div class="big">${fmt((st.players || []).reduce((a, p) => a + (p.bjBet || 0) + (p.bjSplitBet || 0), 0))}</div><div class="mut">Total Taruhan</div></div>
    <div class="card"><h3>Feed Terbaru</h3><div class="mut" style="font-weight:bold;color:var(--gold)">${esc(st.lastEvent || '-')}</div></div>
  </div>`;
  
  const playing = bj.phase === 'playing';
  h += `<div class="card"><h3>Daftar Taruhan Pemain</h3>` + (st.players || []).map(p => {
    let ex = '';
    if (st.isHost && playing && ((p.bjBet || 0) > 0 || (p.bjSplitBet || 0) > 0)) {
      ex = `<div class="row" style="margin-top:6px">
        <button class="ok s" onclick="api('bjResolve',{id:${p.id},result:'win'})">Menang</button>
        <button class="y s" onclick="api('bjResolve',{id:${p.id},result:'bj'})">BJ 3:2</button>
        <button class="g s" onclick="api('bjResolve',{id:${p.id},result:'push'})">Seri</button>
        <button class="r s" onclick="api('bjResolve',{id:${p.id},result:'lose'})">Kalah</button></div>`;
    }
    return pRow(p, ex);
  }).join('') + '</div>';

  if (me && bj.phase === 'betting') {
    h += `<div class="card"><h3>Taruhanmu: ${fmt(me.bjBet)}</h3><div class="chips">` +
      [5, 10, 25, 100, 500].map(v => `<button class="chip c${v}" onclick="api('bet',{amount:${(me.bjBet || 0) + v}})">${v}</button>`).join('') +
      `<button class="chip callin" onclick="api('bet',{amount:${(me.chips || 0) + (me.bjBet || 0)}})">ALL IN</button>` +
      `</div><div class="row"><button class="g f" onclick="api('bet',{amount:0})">Reset</button>
      ${me.last ? `<button class="g f" onclick="api('bet',{amount:${me.last}})">Ulang (${fmt(me.last)})</button>` : ''}</div></div>`;
  }

  if (me && playing && (me.bjBet || 0) > 0) {
    h += `<div class="card"><h3>Opsi Tambahan</h3>
      <div class="row"><button class="b f" onclick="api('add',{amount:${me.bjBet}})">Double (+${fmt(me.bjBet)})</button>
      <button class="y f" onclick="api('splitBJ')">Split (+${fmt(me.bjBet)})</button></div></div>`;
  }

  if (st.isHost) {
    h += `<div class="card"><h3>Kontrol Bandar</h3><div class="row">` + (playing ?
      `<button class="ok f s" onclick="api('bjAll',{result:'win'})">Semua Menang</button>
       <button class="g f s" onclick="api('bjAll',{result:'push'})">Semua Seri</button>
       <button class="r f s" onclick="api('bjAll',{result:'lose'})">Semua Kalah</button>
       <button class="g s" onclick="if(confirm('Batalkan ronde?'))api('bjCancel')">Batal</button>`
      : `<button class="y f" onclick="api('bjDeal')">Kunci Taruhan & Bagi Kartu</button>`) + `</div></div>`;
  }
  return h;
}

function hostPanel() {
  let h = `<div class="card"><h3>Pengaturan Meja</h3>
    <div class="tabs row" style="margin-bottom:8px"><button class="${st.mode === 'poker' ? 'y' : 'g'}" onclick="api('setup',{mode:'poker'})">♠ Poker</button><button class="${st.mode === 'blackjack' ? 'y' : 'g'}" onclick="api('setup',{mode:'blackjack'})">♣ Blackjack</button></div>
    <div class="row"><div style="flex:1"><div class="mut">Chip Awal</div><input id="sc" type="number" value="${d('sc', st.startChips)}" oninput="setD('sc',this.value)"></div>
    <div style="flex:1"><div class="mut">Small Blind</div><input id="sb" type="number" value="${d('sb', st.sb)}" oninput="setD('sb',this.value)"></div>
    <div style="flex:1"><div class="mut">Big Blind</div><input id="bb" type="number" value="${d('bb', st.bb)}" oninput="setD('bb',this.value)"></div></div>
    <button class="ok" style="width:100%;margin-top:8px" onclick="api('setup',{startChips:num('sc'),sb:num('sb'),bb:num('bb')})">Simpan Pengaturan</button></div>
    
    <div class="card"><h3>Kelola Pemain</h3>` +
    (st.players || []).map(p => `<div class="pl"><div><b>${esc(p.name)}</b> <span class="mut">(${fmt(p.chips)})</span></div>
      <div class="row">
      <button class="g s" onclick="if(confirm('Tawarkan peran Bandar ke ${esc(p.name)}? Dia harus menyetujui dulu.'))api('transferHost',{targetId:${p.id}})">Tawarkan Bandar</button>
      <button class="ok s" onclick="api('adjust',{id:${p.id},delta:100})">+100</button>
      <button class="r s" onclick="api('adjust',{id:${p.id},delta:-100})">-100</button>
      <button class="r s" onclick="if(confirm('Keluarkan ${esc(p.name)}?'))api('kick',{id:${p.id}})">✕</button></div></div>`).join('') +
    `<button class="g" style="width:100%;margin-top:8px" onclick="if(confirm('Reset semua chip?'))api('resetAll')">Reset Semua Chip</button></div>`;
  return h;
}

function render() {
  if (!roomCode) {
    $('#app').innerHTML = `
      <div class="top"><div class="logo-box"><div class="logo">♠ Chips-<b>in</b></div></div>${themeSelect()}</div>
      <div class="card">
        <h3>Selamat Datang di Chips-in</h3>
        <p class="mut">Aplikasi chip kasino digital lokal untuk Poker & Blackjack IRL bersama teman.</p>
        <div class="row" style="margin-top:12px">
          <button class="y f" onclick="api('hostRoom')">Host Room (Buat Meja Baru)</button>
        </div>
        <div style="margin:16px 0;text-align:center" class="mut">— ATAU —</div>
        <div class="row">
          <input id="rc" placeholder="Kode Room (6 Karakter)" style="text-transform:uppercase" maxlength="6">
          <button class="ok" onclick="let v=$('#rc').value.trim().toUpperCase(); if(v){ roomCode=v; localStorage.cb_room=v; connect(); }">Join Room</button>
        </div>
      </div>`;
    return;
  }

  if (!st) { 
    $('#app').innerHTML = `<div class="card"><div class="mut">Menghubungkan ke Room ${roomCode}…</div><button class="g s" style="margin-top:10px" onclick="roomCode='';localStorage.cb_room='';render()">Batal / Ganti Room</button></div>`; 
    return; 
  }

  const me = st.players ? st.players.find(p => p.id === st.you) : null;
  
  let h = `<div class="top">
    <div class="logo-box">
      <div class="logo">♠ Room: <b>${st.code || roomCode}</b></div>
    </div>
    <div class="row">
      ${themeSelect()}
      ${deferredPrompt ? `<button class="b s" onclick="deferredPrompt.prompt()">Install App</button>` : ''}
      ${!me ? `<button class="g s" onclick="if(confirm('${st.isHost ? 'Keluar dari room? Peran Bandar akan dialihkan otomatis jika kamu tidak kembali dalam 1 menit.' : 'Keluar dari room?'}'))exitRoom()">Keluar Room</button>` : ''}
      ${st.isHost ? `<button class="y s" onclick="hostOpen=!hostOpen;render()">${hostOpen ? 'Tutup Kontrol' : '👑 Bandar'}</button>` : ''}
    </div>
  </div>`;

  if (!me) {
    h += `<div class="card"><h3>${st.isHost ? 'Ikut Bermain Sebagai Pemain (Bandar boleh ikut main)' : 'Gabung ke Meja Ini'}</h3><div class="row"><input id="nm" placeholder="Nama Kamu" maxlength="16" value="${d('nm','')}" oninput="setD('nm',this.value)">
      <button class="y" onclick="api('join',{name:$('#nm').value})">Gabung</button></div></div>`;
  } else {
    h += `<div class="card row sp">
      <div><div class="mut">${esc(me.name)} ${st.isHost ? '👑 (Bandar)' : ''}</div><div class="big">${fmt(me.chips)}</div></div>
      <button class="g s" onclick="if(confirm('${st.isHost ? 'Berhenti ikut bermain? Kamu tetap jadi Bandar.' : 'Keluar dari room?'}'))leaveSeat()">${st.isHost ? 'Berhenti Main' : 'Keluar'}</button>
    </div>`;
  }

  const ph = st.pendingHost;
  if (ph && st.isHost) {
    h += `<div class="card" style="border-color:var(--gold)"><div class="row sp"><div class="mut">Menunggu <b>${esc(ph.targetName)}</b> menerima peran Bandar…</div>
      <button class="g s" onclick="api('cancelHostOffer')">Batalkan</button></div></div>`;
  }

  if (hostOpen && st.isHost) h += hostPanel();

  if (st.mode === 'poker') {
    if (st.isHost && st.poker && !st.poker.active) h += `<button class="y" style="width:100%;margin-bottom:10px;padding:14px" onclick="api('start')">▶ Mulai Hand Baru</button>`;
    h += pokerView(me);
  } else {
    h += bjView(me);
  }

  h += `<div class="card"><h3>Riwayat Permainan</h3><div class="log">${(st.log || []).map(l => `<div>${esc(l)}</div>`).join('') || '—'}</div></div>`;

  if (me && me.chips === 0 && (!st.poker || !st.poker.active || me.folded)) {
    h += `<div class="overlay">
      <h1>CHIPS KAMU HABIS!</h1>
      <p style="color:#fff">Minta Bandar mengisi chip kamu untuk bermain kembali.</p>
    </div>`;
  }

  if (st.winnerName) {
    h += `<div class="winner-modal">
      <div class="confetti-box">🎉 🪙 👑 🪙 🎉</div>
      <h1 style="color:var(--gold);font-size:36px;margin:10px 0">${esc(st.winnerName)} MENANG KASINO!</h1>
      <p style="color:#fff">Menjadi satu-satunya pemenang yang menguasai semua chip!</p>
    </div>`;
  }

  if (ph && me && ph.targetId === me.id) {
    h += `<div class="winner-modal" style="z-index:10000">
      <div style="font-size:48px">👑</div>
      <h1 style="color:var(--gold);font-size:28px;margin:10px 0">Jadi Bandar?</h1>
      <p style="color:#fff;max-width:320px"><b>${esc(ph.fromName)}</b> menawarkan peran <b>Bandar</b> kepadamu. Bandar bisa mengatur chip, memulai hand, dan menentukan pemenang.</p>
      <div class="row" style="margin-top:14px;justify-content:center">
        <button class="ok" onclick="api('respondHost',{accept:true})">Terima</button>
        <button class="r" onclick="api('respondHost',{accept:false})">Tolak</button>
      </div>
    </div>`;
  }

  if (toastMsg) h += `<div class="toast">${esc(toastMsg)}</div>`;
  $('#app').innerHTML = h;
}

// PENTING: tampilkan UI dulu, baru sambungkan (kalau tidak, layar kosong saat belum ada room)
render();
connect();
</script>
</body>
</html>
